# La base de la billetterie, que Hibernate emprunte au pool HikariCP de Helidon.
javax.sql.DataSource.ticketing.dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
javax.sql.DataSource.ticketing.dataSource.url=jdbc:postgresql://localhost:5432/ticketing
javax.sql.DataSource.ticketing.dataSource.user=postgres
javax.sql.DataSource.ticketing.dataSource.password=postgres

# Une connexion par transaction. Par défaut, sous JTA, Hibernate rend la connexion après chaque
# requête, et une transaction peut s'étaler sur plusieurs connexions du pool.
hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
hibernate.hbm2ddl.auto=create
hibernate.show_sql=true

# Les deux bases de la transaction distribuée, en XA.
distributed.sales.url=jdbc:postgresql://localhost:5432/sales
distributed.accounting.url=jdbc:postgresql://localhost:5432/accounting
distributed.user=postgres
distributed.password=postgres
