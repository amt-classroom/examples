# La base du festival, que Flyway et Hibernate empruntent au pool HikariCP de Helidon.
javax.sql.DataSource.festival.dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
javax.sql.DataSource.festival.dataSource.url=jdbc:postgresql://localhost:5432/festival
javax.sql.DataSource.festival.dataSource.user=postgres
javax.sql.DataSource.festival.dataSource.password=postgres

# Une connexion par transaction. Par défaut, sous JTA, Hibernate rend la connexion après chaque
# requête, et une transaction peut s'étaler sur plusieurs connexions du pool.
hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
